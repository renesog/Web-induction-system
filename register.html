<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="register.css">
</head>
<body class="bg-reg" >
     <div class="container">
    <div class="left">
      <div class="login-box">
        <h1 class="texth1">Create an Account</h1>
        <label>Email</label> 
        <input type="email" placeholder="Enter your email" /> 
        <label>Password</label >
        <div><input type="password"  placeholder="Enter your password" /></div>
        <label>Confirm password</label>
        <input type="password" placeholder="Confirm password" />
        <a href="login.html"><button class="login-btn">Register  </button></a>
        <div class="options">
          <p>Already have an account ? <a href="login.html" class="SignIn-line" id="SignIn">Sign In</a></p>
        </div>
      </div>
    </div>
    <div class="right"></div>
  </div>
  <script src="register.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Induction System</title>

    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

    <link rel="stylesheet" href="style5.css">
</head>
<body class="flex bg-[#f9fbf9]">

    <aside class="sidebar">
        <div class="flex flex-col items-center mb-10">
            <img src="https://cdn-icons-png.flaticon.com/512/2304/2304779.png" class="w-16 mb-4 opacity-90" alt="Logo">
            <h2 class="text-white font-bold text-xl tracking-wide">Induction System</h2>
        </div>
        
        <nav class="space-y-2 px-2">
            <a href="index.html" class="nav-link">
                <i class="fa-solid fa-house w-6 text-center mr-2"></i> หน้าหลัก
            </a>
            <a href="cattle_info.html" class="nav-link">
                <i class="fa-solid fa-cow w-6 text-center mr-2"></i> บันทึกข้อมูลโค
            </a>
            <a href="feeding.html" class="nav-link">
                <i class="fa-solid fa-wheat-awn w-6 text-center mr-2"></i> ข้อมูลการให้อาหาร
            </a>
            <a href="growth.html" class="nav-link">
                <i class="fa-solid fa-chart-line w-6 text-center mr-2"></i> ข้อมูลการเจริญเติบโต
            </a>
            <a href="health.html" class="nav-link">
                <i class="fa-solid fa-heart-pulse w-6 text-center mr-2"></i> ข้อมูลสุขภาพและการดูแล
            </a>
        </nav>
    </aside>

    <main class="main-content">
        
        <header class="header shadow-sm relative z-50" style="background-color: #85C38C;">
            <div class="relative">
                <button id="profileBtn" class="w-[45px] h-[45px] bg-white rounded-full flex items-center justify-center text-lg cursor-pointer hover:scale-110 transition shadow-md focus:outline-none">
                    <i class="fa-regular fa-user text-gray-600"></i>
                </button>

                <div id="profileDropdown" class="hidden absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-xl border border-gray-100 transform origin-top-right transition-all z-50 overflow-hidden">
                    <a href="login.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-3 text-lg"></i> 
                        <span class="font-medium">ออกจากระบบ</span>
                    </a>
                </div>
            </div>
        </header>

        <div class="p-8 max-w-5xl mx-auto">
            
            <div class="bg-white rounded-[20px] p-6 mb-6 shadow-sm border border-gray-100 flex items-center gap-4">
                <span class="material-symbols-outlined text-6xl text-gray-400">account_circle</span>
                <span class="text-xl text-gray-600 font-medium">kaiPta@gmail.com</span>
            </div>

            <div class="bg-[#A8D5BA] rounded-[25px] p-10 relative shadow-md">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                    <div class="space-y-1">
                        <label class="font-bold text-[#2D4A31]">ชื่อ :</label>
                        <div class="bg-white rounded-xl flex items-center px-4 py-2 shadow-inner">
                            <input type="text" value="สมชาย" class="w-full bg-transparent outline-none text-gray-700">
                            <span class="material-symbols-outlined text-gray-400 cursor-pointer">edit_square</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-[#2D4A31]">นามสกุล :</label>
                        <div class="bg-white rounded-xl flex items-center px-4 py-2 shadow-inner">
                            <input type="text" value="ใจดี" class="w-full bg-transparent outline-none text-gray-700">
                            <span class="material-symbols-outlined text-gray-400 cursor-pointer">edit_square</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-[#2D4A31]">Email :</label>
                        <div class="bg-white rounded-xl flex items-center px-4 py-2 shadow-inner">
                            <input type="email" value="kaiPta@gmail.com" readonly class="w-full bg-transparent outline-none text-gray-500 cursor-not-allowed">
                            <span class="material-symbols-outlined text-gray-400">lock</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-[#2D4A31]">เบอร์โทรศัพท์ :</label>
                        <div class="bg-white rounded-xl flex items-center px-4 py-2 shadow-inner">
                            <input type="tel" value="081-234-5678" class="w-full bg-transparent outline-none text-gray-700">
                            <span class="material-symbols-outlined text-gray-400 cursor-pointer">edit_square</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="font-bold text-[#2D4A31]">ชื่อฟาร์ม :</label>
                        <div class="bg-white rounded-xl flex items-center px-4 py-2 shadow-inner">
                            <input type="text" placeholder="ระบุชื่อฟาร์ม" class="w-full bg-transparent outline-none text-gray-700">
                            <span class="material-symbols-outlined text-gray-400 cursor-pointer">edit_square</span>
                        </div>
                    </div>
                </div>

                <div class="flex justify-center mt-12">
                    <a href="index.html">
                        <button class="bg-[#28a745] hover:bg-[#218838] text-white px-16 py-3 rounded-full font-bold text-lg shadow-lg transition transform hover:scale-105">
                            บันทึกข้อมูล
                        </button>
                    </a>
                </div>

                <img src="image/grass.png" class="absolute bottom-0 left-5 w-32 opacity-90 pointer-events-none" alt="">
                <img src="image/cow-sticker.png" class="absolute bottom-2 right-5 w-24 pointer-events-none" alt="">
            </div>

        </div>
    </main>

    <script>
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');

        if(profileBtn && profileDropdown) {
            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('hidden');
            });

            document.addEventListener('click', (e) => {
                if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                    profileDropdown.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>

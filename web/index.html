<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Induction System</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style5.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="flex bg-[#f9fbf9]">

    <aside class="sidebar">
        <div class="flex flex-col items-center mb-10">
            <img src="image/cow 1.png" class="w-16 mb-4 opacity-90" alt="Logo">
            <h2 class="text-white font-bold text-xl tracking-wide">Induction System</h2>
        </div>

        <nav class="space-y-2 px-2">
            <a href="index.html" class="nav-link active">
                <i class="fa-solid fa-house w-6 text-center mr-2"></i> หน้าหลัก
            </a>
            <a href="cattle_info.html" class="nav-link">
                <i class="fa-solid fa-cow w-6 text-center mr-2"></i> บันทึกข้อมูลโค
            </a>
            <a href="feeding.html" class="nav-link">
                <i class="fa-solid fa-wheat-awn w-6 text-center mr-2"></i> ข้อมูลการให้อาหาร
            </a>
            <a href="growth.html" class="nav-link">
                <i class="fa-solid fa-chart-line w-6 text-center mr-2"></i> ข้อมูลการเจริญเติบโต
            </a>
            <a href="health.html" class="nav-link">
                <i class="fa-solid fa-heart-pulse w-6 text-center mr-2"></i> ข้อมูลสุขภาพและการดูแล
            </a>
        </nav>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main class="main-content">

        <header class="header shadow-sm relative z-50">
            <!-- Hamburger Menu Button -->
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="relative">
                <button id="profileBtn"
                    class="user-icon shadow-md cursor-pointer hover:bg-gray-50 transition focus:outline-none">
                    <i class="fa-regular fa-user text-gray-600"></i>
                </button>

                <div id="profileDropdown"
                    class="hidden absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-xl py-2 border border-gray-100 transform origin-top-right transition-all">
                    <a href="profile.html"
                        class="flex items-center px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-700 transition">
                        <i class="fa-regular fa-circle-user mr-3 text-lg"></i>
                        <span class="font-medium">โปรไฟล์</span>
                    </a>
                    <div class="border-t border-gray-100 my-1"></div>
                    <a href="login.html"
                        class="flex items-center px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-3 text-lg"></i>
                        <span class="font-medium">ออกจากระบบ</span>
                    </a>
                </div>
            </div>
        </header>

        <div class="p-8">
            <h1 class="text-3xl font-bold text-[#2D4A31] mb-8 border-l-8 border-[#85C38C] pl-4">
                ภาพรวมระบบ (DASHBOARD)
            </h1>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">

                <div
                    class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">โคเพศผู้ (ตัว)</p>
                        <h2 class="text-3xl font-bold text-gray-800 mt-1">249</h2>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
                        <i class="fa-solid fa-mars text-xl"></i>
                    </div>
                </div>

                <div
                    class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">โคเพศเมีย (ตัว)</p>
                        <h2 class="text-3xl font-bold text-gray-800 mt-1">83</h2>
                    </div>
                    <div class="w-12 h-12 bg-pink-100 rounded-full flex items-center justify-center text-pink-600">
                        <i class="fa-solid fa-venus text-xl"></i>
                    </div>
                </div>

                <div
                    class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">คำสั่งขาย (รายการ)</p>
                        <h2 class="text-3xl font-bold text-gray-800 mt-1">79</h2>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-full flex items-center justify-center text-green-600">
                        <i class="fa-solid fa-sack-dollar text-xl"></i>
                    </div>
                </div>

                <div
                    class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:shadow-md transition">
                    <div>
                        <p class="text-gray-500 text-sm font-medium">คำสั่งซื้อ (รายการ)</p>
                        <h2 class="text-3xl font-bold text-gray-800 mt-1">56</h2>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-full flex items-center justify-center text-orange-600">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-lg text-gray-700">จำนวนโคแยกตามสายพันธุ์</h3>
                        <i class="fa-solid fa-chart-simple text-gray-400"></i>
                    </div>
                    <div id="bar-chart"></div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-lg text-gray-700">ยอดคำสั่งซื้อและคำสั่งขาย</h3>
                        <i class="fa-solid fa-chart-area text-gray-400"></i>
                    </div>
                    <div id="area-chart"></div>
                </div>

            </div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/apexcharts/3.35.3/apexcharts.min.js"></script>

    <!-- Sidebar Toggle Script -->
    <script>
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        // Close sidebar on window resize (if larger than mobile)
        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove('sidebar-open');
            }
        });

        // Close sidebar when clicking nav links on mobile
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function () {
                if (window.innerWidth <= 768) {
                    document.body.classList.remove('sidebar-open');
                }
            });
        });
    </script>

    <script src="dashboard.js"></script>
</body>

</html>

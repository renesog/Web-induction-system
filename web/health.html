<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลสุขภาพและการดูแล - Induction System</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="flex bg-[#f9fbf9]">

    <aside class="sidebar">
        <div class="flex flex-col items-center mb-10">
            <img src="image/cow 1.png" class="w-16 mb-4 opacity-90" alt="Logo">
            <h2 class="text-white font-bold text-xl tracking-wide">Induction System</h2>
        </div>
        <nav class="space-y-2 px-2">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house w-6 text-center mr-2"></i> หน้าหลัก</a>
            <a href="cattle_info.html" class="nav-link"><i class="fa-solid fa-cow w-6 text-center mr-2"></i>
                บันทึกข้อมูลโค</a>
            <a href="feeding.html" class="nav-link"><i class="fa-solid fa-wheat-awn w-6 text-center mr-2"></i>
                ข้อมูลการให้อาหาร</a>
            <a href="growth.html" class="nav-link"><i class="fa-solid fa-chart-line w-6 text-center mr-2"></i>
                ข้อมูลการเจริญเติบโต</a>
            <a href="health.html" class="nav-link active"><i class="fa-solid fa-heart-pulse w-6 text-center mr-2"></i>
                ข้อมูลสุขภาพและการดูแล</a>
        </nav>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main class="main-content">
        <header class="header shadow-sm relative z-50">
            <!-- Hamburger Menu Button -->
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="relative">
                <button id="profileBtn"
                    class="user-icon shadow-md cursor-pointer hover:bg-gray-50 transition focus:outline-none">
                    <i class="fa-regular fa-user text-gray-600"></i>
                </button>
                <div id="profileDropdown"
                    class="hidden absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-xl py-2 border border-gray-100 transform origin-top-right transition-all">
                    <a href="profile.html"
                        class="flex items-center px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-700 transition">
                        <i class="fa-regular fa-circle-user mr-3 text-lg"></i>
                        <span class="font-medium">โปรไฟล์</span>
                    </a>
                    <div class="border-t border-gray-100 my-1"></div>
                    <a href="login.html"
                        class="flex items-center px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-3 text-lg"></i>
                        <span class="font-medium">ออกจากระบบ</span>
                    </a>
                </div>
            </div>
        </header>

        <div class="p-8">
            <div class="max-w-5xl mx-auto mb-8">
                <h1 class="text-3xl font-bold text-[#2D4A31] mb-6 border-l-8 border-[#85C38C] pl-4">
                    ข้อมูลสุขภาพและการดูแล</h1>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
                    <div class="relative mb-4">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400"><i
                                class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="searchInput" placeholder="ค้นหาด้วย ID หรือ ชื่อโค..."
                            class="w-full p-2 border rounded-lg pl-10 shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>
                    <div class="flex flex-wrap gap-4">
                        <select id="statusFilter"
                            class="p-2 border rounded-lg bg-white min-w-[180px] shadow-sm focus:ring-2 focus:ring-green-400 cursor-pointer">
                            <option value="all">สถานะสุขภาพ (ทั้งหมด)</option>
                            <option value="ปกติ">ปกติ (Normal)</option>
                            <option value="ป่วย">ป่วย (Sick)</option>
                            <option value="รักษาหายแล้ว">รักษาหายแล้ว (Recovered)</option>
                            <option value="เฝ้าระวัง">เฝ้าระวัง (Watch)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="healthGrid"></div>
            </div>
        </div>

        <button onclick="toggleModal()"
            class="fixed bottom-8 right-8 w-16 h-16 bg-[#4ade80] text-white text-4xl rounded-full shadow-lg hover:bg-[#22c55e] hover:scale-110 transition-all flex items-center justify-center z-40">
            <i class="fa-solid fa-plus"></i>
        </button>
    </main>

    <div id="healthModal"
        class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white rounded-[30px] w-full max-w-5xl p-10 relative shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-bold mb-8 text-center text-[#2D4A31]">บันทึกข้อมูลสุขภาพ</h2>

            <div class="flex flex-col md:flex-row gap-10">
                <div class="w-full md:w-1/3">
                    <div
                        class="w-full aspect-square bg-gray-100 rounded-3xl flex items-center justify-center border-2 border-gray-200 relative overflow-hidden shadow-inner">
                        <img id="healthPreview" src="https://cdn-icons-png.flaticon.com/512/1998/1998610.png"
                            class="absolute inset-0 w-full h-full object-cover">
                    </div>
                    <p class="text-center text-xs text-gray-400 mt-2 italic">* รูปภาพดึงจากฐานข้อมูลหลัก</p>
                </div>

                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                    <div class="col-span-full bg-blue-50 p-4 rounded-xl border border-blue-100 mb-2">
                        <label class="font-bold text-blue-800">ค้นหา ID โค :</label>
                        <div class="flex gap-2 mt-1">
                            <input type="text" id="inputID" placeholder="กรอก ID ที่นี่..."
                                class="flex-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 focus:outline-none">
                            <button onclick="pullData()"
                                class="bg-blue-600 text-white px-4 rounded-lg font-bold hover:bg-blue-700 transition shadow-sm"><i
                                    class="fa-solid fa-download mr-1"></i> ดึงข้อมูล</button>
                        </div>
                    </div>

                    <div class="space-y-1"><label class="font-bold text-gray-700">ชื่อ/ฉายา :</label><input type="text"
                            id="inputName" class="w-full p-2 border rounded-lg bg-gray-100 cursor-not-allowed" readonly>
                    </div>
                    <div class="space-y-1"><label class="font-bold text-gray-700">สายพันธุ์ :</label><input type="text"
                            id="inputBreed" class="w-full p-2 border rounded-lg bg-gray-100 cursor-not-allowed"
                            readonly></div>

                    <div class="border-t border-gray-200 col-span-full my-2"></div>

                    <div class="space-y-1"><label class="font-bold text-green-700">วันที่ตรวจ/รักษา :</label><input
                            type="date" id="inputDate" class="w-full p-2 border rounded-lg cursor-pointer"></div>
                    <div class="space-y-1"><label class="font-bold text-gray-700">สถานะสุขภาพ :</label>
                        <select id="inputStatus" class="w-full p-2 border rounded-lg bg-white">
                            <option value="ปกติ">ปกติ (Normal)</option>
                            <option value="ป่วย">ป่วย (Sick)</option>
                            <option value="รักษาหายแล้ว">รักษาหายแล้ว (Recovered)</option>
                            <option value="เฝ้าระวัง">เฝ้าระวัง (Watch)</option>
                        </select>
                    </div>
                    <div class="space-y-1 col-span-full"><label class="font-bold text-gray-700">อาการ/โรคที่พบ
                            :</label><input type="text" id="inputSymptoms" placeholder="เช่น ซึม, ไม่กินหญ้า, ขาเจ็บ"
                            class="w-full p-2 border rounded-lg"></div>
                    <div class="space-y-1 col-span-full"><label class="font-bold text-gray-700">การรักษา/ยาที่ให้
                            :</label><input type="text" id="inputTreatment"
                            placeholder="เช่น ฉีดยาแก้อักเสบ, ให้วิตามิน" class="w-full p-2 border rounded-lg"></div>

                    <div class="space-y-1"><label class="font-bold text-gray-700">ค่าใช้จ่าย (บาท) :</label><input
                            type="number" id="inputCost" class="w-full p-2 border rounded-lg" placeholder="0"></div>
                    <div class="space-y-1"><label class="font-bold text-gray-700">สัตวแพทย์/ผู้ตรวจ :</label><input
                            type="text" id="inputOfficer" class="w-full p-2 border rounded-lg"></div>
                </div>
            </div>

            <div class="mt-8 flex justify-center gap-4">
                <button onclick="toggleModal()"
                    class="px-8 py-2 bg-gray-400 text-white rounded-full hover:bg-gray-500 transition">ยกเลิก</button>
                <button onclick="saveHealthData()"
                    class="px-12 py-2 bg-[#0b5c13] text-white rounded-full font-bold shadow-md hover:bg-[#08450e] transition transform hover:scale-105">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Dropdown & Initial ---
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        if (profileBtn && profileDropdown) {
            profileBtn.addEventListener('click', (e) => { e.stopPropagation(); profileDropdown.classList.toggle('hidden'); });
            document.addEventListener('click', (e) => { if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) { profileDropdown.classList.add('hidden'); } });
        }

        let editId = null;
        let currentCowImage = "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
        window.onload = () => filterHealthData();

        // --- 2. Pull Data Function (เหมือนหน้า Growth) ---
        function pullData() {
            const tid = document.getElementById('inputID').value;
            const mainData = JSON.parse(localStorage.getItem('cattleMainData')) || [];
            const cow = mainData.find(c => c.id === tid);

            if (cow) {
                // เติมข้อมูลอัตโนมัติ
                document.getElementById('inputName').value = cow.name;
                document.getElementById('inputBreed').value = cow.breed;

                // ดึงรูปภาพ
                currentCowImage = cow.image || "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
                document.getElementById('healthPreview').src = currentCowImage;

                // แจ้งเตือนเล็กน้อย (Optional)
                // alert("ดึงข้อมูล " + cow.name + " สำเร็จ!");
            } else {
                alert("ไม่พบ ID: " + tid + " ในฐานข้อมูลหลัก กรุณาตรวจสอบอีกครั้ง");
                document.getElementById('inputName').value = "";
                document.getElementById('inputBreed').value = "";
                document.getElementById('healthPreview').src = "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
            }
        }

        // --- 3. CRUD Logic ---
        function toggleModal() {
            document.getElementById('healthModal').classList.toggle('hidden');
            if (document.getElementById('healthModal').classList.contains('hidden')) { editId = null; clearForm(); }
        }

        function saveHealthData() {
            const id = document.getElementById('inputID').value;
            const name = document.getElementById('inputName').value;

            if (!id || !name) return alert("กรุณาระบุ ID และกดปุ่ม 'ดึงข้อมูล' ก่อนบันทึก");

            const record = {
                id: id,
                name: name,
                breed: document.getElementById('inputBreed').value,
                date: document.getElementById('inputDate').value,
                status: document.getElementById('inputStatus').value,
                symptoms: document.getElementById('inputSymptoms').value,
                treatment: document.getElementById('inputTreatment').value,
                cost: document.getElementById('inputCost').value || 0,
                officer: document.getElementById('inputOfficer').value,
                image: currentCowImage,
                recordId: Date.now().toString() // Unique ID สำหรับรายการสุขภาพนี้
            };

            let list = JSON.parse(localStorage.getItem('cattleHealthData')) || [];

            if (editId) {
                const idx = list.findIndex(r => r.recordId === editId);
                if (idx !== -1) list[idx] = { ...record, recordId: editId }; // Keep original recordId
            } else {
                list.push(record);
            }

            localStorage.setItem('cattleHealthData', JSON.stringify(list));
            filterHealthData(); toggleModal();
        }

        function renderCard(rec) {
            // กำหนดสีตามสถานะ
            let statusColor = "bg-gray-100 text-gray-600";
            if (rec.status === "ปกติ") statusColor = "bg-green-100 text-green-700";
            if (rec.status === "ป่วย") statusColor = "bg-red-100 text-red-700";
            if (rec.status === "เฝ้าระวัง") statusColor = "bg-orange-100 text-orange-700";

            const html = `
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-sm hover:shadow-md transition-all flex flex-col">
                    <div class="h-40 overflow-hidden bg-gray-100 relative">
                        <img src="${rec.image}" class="w-full h-full object-cover" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1998/1998610.png'">
                        <div class="absolute top-2 right-2 px-3 py-1 rounded-full text-xs font-bold ${statusColor} shadow-sm">
                            ${rec.status}
                        </div>
                    </div>
                    <div class="p-4 flex-1 text-sm space-y-2">
                        <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                            <span class="font-bold text-lg text-gray-800">${rec.name}</span>
                            <span class="text-xs text-gray-500">ID: ${rec.id}</span>
                        </div>
                        <p><i class="fa-regular fa-calendar text-green-600 w-5"></i> <strong>วันที่ :</strong> ${rec.date || '-'}</p>
                        <p><i class="fa-solid fa-stethoscope text-green-600 w-5"></i> <strong>อาการ :</strong> ${rec.symptoms || '-'}</p>
                        <p><i class="fa-solid fa-syringe text-green-600 w-5"></i> <strong>รักษา :</strong> ${rec.treatment || '-'}</p>
                        <p><i class="fa-solid fa-coins text-green-600 w-5"></i> <strong>ค่าใช้จ่าย :</strong> ${rec.cost} บาท</p>
                        <p class="text-xs text-gray-400 mt-2">ผู้ตรวจ: ${rec.officer || '-'}</p>
                        
                        <div class="flex justify-end gap-2 mt-3 pt-3 border-t border-gray-100">
                            <button onclick="editCard('${rec.recordId}')" class="w-8 h-8 bg-white border border-gray-300 rounded-full text-gray-600 hover:text-blue-600 hover:border-blue-300 transition"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteCard('${rec.recordId}')" class="w-8 h-8 bg-white border border-gray-300 rounded-full text-gray-600 hover:text-red-600 hover:border-red-300 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('healthGrid').insertAdjacentHTML('afterbegin', html);
        }

        function filterHealthData() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            let list = JSON.parse(localStorage.getItem('cattleHealthData')) || [];

            document.getElementById('healthGrid').innerHTML = '';

            const filtered = list.filter(r => {
                const matchSearch = r.id.toLowerCase().includes(s) || r.name.toLowerCase().includes(s) || r.symptoms.toLowerCase().includes(s);
                const matchStatus = status === 'all' || r.status === status;
                return matchSearch && matchStatus;
            });

            if (filtered.length === 0) {
                document.getElementById('healthGrid').innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
                        <div class="bg-gray-100 p-6 rounded-full mb-4"><i class="fa-solid fa-magnifying-glass text-4xl text-gray-300"></i></div>
                        <p class="text-xl font-medium">ไม่พบข้อมูลที่ค้นหา</p>
                    </div>`;
            } else {
                filtered.forEach(r => renderCard(r));
            }
        }

        function editCard(recordId) {
            const list = JSON.parse(localStorage.getItem('cattleHealthData')) || [];
            const rec = list.find(r => r.recordId === recordId);
            if (rec) {
                editId = recordId;
                document.getElementById('inputID').value = rec.id;
                document.getElementById('inputName').value = rec.name;
                document.getElementById('inputBreed').value = rec.breed;
                document.getElementById('inputDate').value = rec.date;
                document.getElementById('inputStatus').value = rec.status;
                document.getElementById('inputSymptoms').value = rec.symptoms;
                document.getElementById('inputTreatment').value = rec.treatment;
                document.getElementById('inputCost').value = rec.cost;
                document.getElementById('inputOfficer').value = rec.officer;
                currentCowImage = rec.image;
                document.getElementById('healthPreview').src = rec.image || "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
                toggleModal();
            }
        }

        function deleteCard(recordId) {
            if (confirm("ต้องการลบประวัติสุขภาพรายการนี้หรือไม่?")) {
                let list = JSON.parse(localStorage.getItem('cattleHealthData')) || [];
                list = list.filter(r => r.recordId !== recordId);
                localStorage.setItem('cattleHealthData', JSON.stringify(list));
                filterHealthData();
            }
        }

        function clearForm() {
            document.querySelectorAll('#healthModal input, #healthModal select').forEach(i => i.value = '');
            document.getElementById('healthPreview').src = "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
        }

        document.getElementById('searchInput').addEventListener('input', filterHealthData);
        document.getElementById('statusFilter').addEventListener('change', filterHealthData);

        // Sidebar Toggle Functions
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove('sidebar-open');
            }
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function () {
                if (window.innerWidth <= 768) {
                    document.body.classList.remove('sidebar-open');
                }
            });
        });
    </script>
</body>

</html>

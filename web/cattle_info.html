<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อมูลโค - Induction System</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Montserrat:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="style5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="auth.js"></script>
</head>

<body class="flex bg-[#f9fbf9]">

    <aside class="sidebar">
        <div class="flex flex-col items-center mb-10">
            <img src="image/cow 1.png" class="w-16 mb-4 opacity-90" alt="Logo">
            <h2 class="text-white font-bold text-xl tracking-wide">Induction System</h2>
        </div>

        <nav class="space-y-2 px-2">
            <a href="index.html" class="nav-link">
                <i class="fa-solid fa-house w-6 text-center mr-2"></i> หน้าหลัก
            </a>
            <a href="cattle_info.html" class="nav-link active">
                <i class="fa-solid fa-cow w-6 text-center mr-2"></i> บันทึกข้อมูลโค
            </a>
            <a href="feeding.html" class="nav-link">
                <i class="fa-solid fa-wheat-awn w-6 text-center mr-2"></i> ข้อมูลการให้อาหาร
            </a>
            <a href="growth.html" class="nav-link">
                <i class="fa-solid fa-chart-line w-6 text-center mr-2"></i> ข้อมูลการเจริญเติบโต
            </a>
            <a href="health.html" class="nav-link">
                <i class="fa-solid fa-heart-pulse w-6 text-center mr-2"></i> ข้อมูลสุขภาพและการดูแล
            </a>
        </nav>
    </aside>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <main class="main-content">

        <header class="header shadow-sm relative z-50">
            <!-- Hamburger Menu Button -->
            <button class="hamburger-btn" onclick="toggleSidebar()">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="relative">
                <button id="profileBtn"
                    class="user-icon shadow-md cursor-pointer hover:bg-gray-50 transition focus:outline-none">
                    <i class="fa-regular fa-user text-gray-600"></i>
                </button>

                <div id="profileDropdown"
                    class="hidden absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-xl py-2 border border-gray-100 transform origin-top-right transition-all">
                    <a href="profile.html"
                        class="flex items-center px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-700 transition">
                        <i class="fa-regular fa-circle-user mr-3 text-lg"></i>
                        <span class="font-medium">โปรไฟล์</span>
                    </a>
                    <div class="border-t border-gray-100 my-1"></div>
                    <a href="login.html"
                        class="flex items-center px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-3 text-lg"></i>
                        <span class="font-medium">ออกจากระบบ</span>
                    </a>
                </div>
            </div>
        </header>

        <div class="p-8">
            <div class="max-w-7xl mx-auto mb-8">
                <h1 class="text-3xl font-bold text-[#2D4A31] mb-6 border-l-8 border-[#85C38C] pl-4">
                    บันทึกข้อมูลโค
                </h1>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
                    <div class="relative mb-4">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchInput" placeholder="ค้นหาด้วย ID หรือ ชื่อโค..."
                            class="w-full p-2 border rounded-lg pl-10 shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>
                    <div class="flex gap-4 flex-col md:flex-row">
                        <select id="breedFilter"
                            class="p-2 border rounded-lg bg-white w-full md:w-auto shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none cursor-pointer">
                            <option value="all">สายพันธุ์ (ทั้งหมด)</option>
                            <option value="บราห์มัน">บราห์มัน</option>
                            <option value="ชาร์โรเลส์">ชาร์โรเลส์</option>
                            <option value="แองกัส">แองกัส</option>
                            <option value="พื้นเมือง">พื้นเมือง</option>
                        </select>
                        <select id="penFilter"
                            class="p-2 border rounded-lg bg-white w-full md:w-auto shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none cursor-pointer">
                            <option value="all">คอก (ทั้งหมด)</option>
                            <option value="คอก 1">คอก 1</option>
                            <option value="คอก 2">คอก 2</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="cattleGrid"></div>
            </div>
        </div>

        <button onclick="toggleModal()"
            class="fixed bottom-8 right-8 w-16 h-16 bg-[#4ade80] text-white text-4xl rounded-full shadow-lg hover:bg-[#22c55e] hover:scale-110 transition-all flex items-center justify-center z-40">
            <i class="fa-solid fa-plus"></i>
        </button>

    </main>

    <div id="cattleModal"
        class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white rounded-[30px] w-full max-w-5xl p-10 relative shadow-2xl overflow-y-auto max-h-[90vh]">
            <h2 class="text-2xl font-bold mb-6 text-center text-[#2D4A31]">บันทึกข้อมูลโคหลัก</h2>

            <div class="flex flex-col md:flex-row gap-8">
                <div
                    class="w-full md:w-1/3 flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-2xl p-6 bg-gray-50 relative overflow-hidden hover:bg-gray-100 transition">
                    <img id="previewImage" src=""
                        class="absolute inset-0 w-full h-full object-cover hidden rounded-2xl">
                    <div id="placeholderText" class="text-center text-gray-400">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl mb-2"></i>
                        <p class="font-bold">แนบรูปภาพโค</p>
                    </div>
                    <input type="file" id="inputImage" class="absolute inset-0 opacity-0 cursor-pointer"
                        onchange="handleImage(this)">
                </div>

                <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1"><label class="text-sm font-bold text-gray-700">ID :</label><input type="text"
                            id="inputID"
                            class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>
                    <div class="space-y-1"><label class="text-sm font-bold text-gray-700">ชื่อ/ฉายา :</label><input
                            type="text" id="inputName"
                            class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>

                    <div class="space-y-1">
                        <label class="text-sm font-bold text-gray-700">สายพันธุ์ :</label>
                        <select id="inputBreed"
                            class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none cursor-pointer">
                            <option value="บราห์มัน">บราห์มัน</option>
                            <option value="ชาร์โรเลส์">ชาร์โรเลส์</option>
                            <option value="แองกัส">แองกัส</option>
                        </select>
                    </div>

                    <div class="space-y-1">
                        <label class="text-sm font-bold text-gray-700">อายุ :</label>
                        <div class="flex gap-2">
                            <input type="number" id="inputAgeYear" placeholder="ปี"
                                class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
                            <input type="number" id="inputAgeMonth" placeholder="เดือน"
                                class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
                        </div>
                    </div>

                    <div class="space-y-1"><label class="text-sm font-bold text-gray-700">เพศ :</label><select
                            id="inputGender"
                            class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none cursor-pointer">
                            <option value="ตัวผู้">ตัวผู้</option>
                            <option value="ตัวเมีย">ตัวเมีย</option>
                        </select></div>
                    <div class="space-y-1"><label class="text-sm font-bold text-gray-700">สถานะ :</label><select
                            id="inputStatus"
                            class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none cursor-pointer">
                            <option value="พ่อพันธุ์ / แม่พันธุ์">พ่อพันธุ์ / แม่พันธุ์</option>
                            <option value="ขุน">ขุน</option>
                        </select></div>
                    <div class="space-y-1"><label class="text-sm font-bold text-gray-700">ราคาซื้อเข้า :</label><input
                            type="number" id="inputPrice" placeholder="บาท"
                            class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>
                    <div class="space-y-1"><label class="text-sm font-bold text-green-700">คอก :</label><input
                            type="text" id="inputPen"
                            class="w-full p-2 border rounded-lg bg-green-50 focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>
                    <div class="col-span-full space-y-1"><label class="text-sm font-bold text-gray-700">วันเกิด /
                            วันนำเข้าเลี้ยง :</label><input type="date" id="inputDate"
                            class="w-full p-2 border rounded-lg bg-gray-50 cursor-pointer"></div>
                </div>
            </div>

            <div class="mt-8 flex justify-center gap-4">
                <button onclick="toggleModal()"
                    class="px-8 py-2 bg-gray-400 text-white rounded-full hover:bg-gray-500 transition">ยกเลิก</button>
                <button onclick="saveCattle()"
                    class="px-12 py-2 bg-[#0b5c13] text-white rounded-full font-bold shadow-md hover:bg-[#08450e] transition transform hover:scale-105">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Dropdown Logic (เหมือนหน้าอื่น) ---
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        if (profileBtn && profileDropdown) {
            profileBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('hidden');
            });
            document.addEventListener('click', (e) => {
                if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) {
                    profileDropdown.classList.add('hidden');
                }
            });
        }

        // --- 2. Cattle Logic ---
        let editId = null;
        let base64Image = "";

        // Initial Load
        window.onload = () => filterData();

        function handleImage(input) {
            const reader = new FileReader();
            reader.onload = (e) => {
                base64Image = e.target.result;
                document.getElementById('previewImage').src = base64Image;
                document.getElementById('previewImage').classList.remove('hidden');
                document.getElementById('placeholderText').classList.add('hidden');
            };
            if (input.files[0]) reader.readAsDataURL(input.files[0]);
        }

        function toggleModal() {
            document.getElementById('cattleModal').classList.toggle('hidden');
            if (document.getElementById('cattleModal').classList.contains('hidden')) { clearForm(); editId = null; }
        }

        function saveCattle() {
            const id = document.getElementById('inputID').value;
            const cow = {
                id,
                name: document.getElementById('inputName').value,
                breed: document.getElementById('inputBreed').value,
                ageYear: document.getElementById('inputAgeYear').value || 0,
                ageMonth: document.getElementById('inputAgeMonth').value || 0,
                gender: document.getElementById('inputGender').value,
                status: document.getElementById('inputStatus').value,
                price: document.getElementById('inputPrice').value || 0,
                pen: document.getElementById('inputPen').value,
                date: document.getElementById('inputDate').value,
                image: base64Image || "https://cdn-icons-png.flaticon.com/512/1998/1998610.png" // Placeholder image
            };
            if (!id || !cow.name) return alert("กรุณากรอก ID และชื่อโค");
            let list = JSON.parse(localStorage.getItem('cattleMainData')) || [];
            if (editId) { const idx = list.findIndex(c => c.id === editId); list[idx] = cow; }
            else { if (list.some(c => c.id === id)) return alert("ID ซ้ำ!"); list.push(cow); }
            localStorage.setItem('cattleMainData', JSON.stringify(list));
            filterData(); toggleModal();
        }

        function renderCard(cow) {
            const html = `
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-sm hover:shadow-md transition-all flex flex-col group">
                    <div class="h-48 overflow-hidden bg-gray-100 relative">
                        <img src="${cow.image}" class="w-full h-full object-cover transform transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1998/1998610.png'">
                    </div>
                    <div class="bg-[#D1F2D3] p-4 flex-1 text-sm space-y-2 border-t border-green-100">
                        <div class="flex justify-between items-center pb-2 border-b border-green-200/50">
                            <span class="font-bold text-[#2D4A31] text-lg">ID: ${cow.id}</span>
                            <span class="px-2 py-1 bg-green-600 text-white text-xs rounded-full">${cow.breed}</span>
                        </div>
                        <p><strong>ชื่อ :</strong> ${cow.name}</p>
                        <p><strong>อายุ :</strong> ${cow.ageYear} ปี ${cow.ageMonth} เดือน</p>
                        <p><strong>วันเกิด :</strong> ${cow.date || '-'}</p>
                        <p><strong>คอก :</strong> ${cow.pen || '-'}</p>
                        <div class="flex justify-end gap-2 mt-4 pt-2">
                            <button onclick="editCow('${cow.id}')" class="w-8 h-8 bg-white rounded-full border border-gray-200 text-gray-600 hover:text-green-600 shadow-sm transition"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteCow('${cow.id}')" class="w-8 h-8 bg-white rounded-full border border-red-100 text-red-400 hover:text-red-600 shadow-sm transition"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('cattleGrid').insertAdjacentHTML('afterbegin', html);
        }

        function filterData() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const b = document.getElementById('breedFilter').value;
            const p = document.getElementById('penFilter').value;
            let list = JSON.parse(localStorage.getItem('cattleMainData')) || [];

            document.getElementById('cattleGrid').innerHTML = '';

            const filtered = list.filter(c => {
                const matchSearch = c.id.toLowerCase().includes(s) || c.name.toLowerCase().includes(s);
                const matchBreed = b === 'all' || c.breed === b;
                const matchPen = p === 'all' || c.pen === p;
                return matchSearch && matchBreed && matchPen;
            });

            if (filtered.length === 0) {
                document.getElementById('cattleGrid').innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
                        <div class="bg-gray-100 p-6 rounded-full mb-4"><i class="fa-solid fa-magnifying-glass text-4xl text-gray-300"></i></div>
                        <p class="text-xl font-medium">ไม่พบข้อมูลที่ค้นหา</p>
                    </div>`;
            } else {
                filtered.forEach(c => renderCard(c));
            }
        }

        function editCow(id) {
            let list = JSON.parse(localStorage.getItem('cattleMainData')) || [];
            const c = list.find(x => x.id === id);
            if (c) {
                editId = id; document.getElementById('inputID').value = c.id; document.getElementById('inputName').value = c.name;
                document.getElementById('inputBreed').value = c.breed; document.getElementById('inputAgeYear').value = c.ageYear;
                document.getElementById('inputAgeMonth').value = c.ageMonth; document.getElementById('inputGender').value = c.gender;
                document.getElementById('inputStatus').value = c.status; document.getElementById('inputPrice').value = c.price;
                document.getElementById('inputPen').value = c.pen; document.getElementById('inputDate').value = c.date;
                base64Image = c.image; document.getElementById('previewImage').src = c.image;
                document.getElementById('previewImage').classList.remove('hidden'); document.getElementById('placeholderText').classList.add('hidden');
                toggleModal();
            }
        }

        function deleteCow(id) {
            if (confirm("ต้องการลบข้อมูลโค ID: " + id + " หรือไม่?")) {
                let list = JSON.parse(localStorage.getItem('cattleMainData')) || [];
                list = list.filter(c => c.id !== id); localStorage.setItem('cattleMainData', JSON.stringify(list)); filterData();
            }
        }

        function clearForm() {
            document.querySelectorAll('#cattleModal input, #cattleModal select').forEach(i => i.value = '');
            document.getElementById('previewImage').classList.add('hidden');
            document.getElementById('placeholderText').classList.remove('hidden');
            base64Image = "";
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('breedFilter').addEventListener('change', filterData);
        document.getElementById('penFilter').addEventListener('change', filterData);

        // Sidebar Toggle Functions
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove('sidebar-open');
            }
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function () {
                if (window.innerWidth <= 768) {
                    document.body.classList.remove('sidebar-open');
                }
            });
        });
    </script>
</body>

</html>

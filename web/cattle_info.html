        async function filterData() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const b = document.getElementById('breedFilter').value;

            try {
                const response = await fetch('/api/cattle');
                const result = await response.json();

                if (result.success) {
                    let filtered = result.data.filter(c => {
                        const matchSearch = (c.cattle_code && c.cattle_code.toLowerCase().includes(s)) ||
                            (c.name && c.name.toLowerCase().includes(s));
                        const matchBreed = b === 'all' || c.breed === b;
                        return matchSearch && matchBreed;
                    });

                    renderAllCattle(filtered);
                }
            } catch (error) {
                console.error('Error filtering:', error);
            }
        }

        async function editCow(id) {
            try {
                const response = await fetch(`/api/cattle/${id}`);
                const result = await response.json();

                if (result.success) {
                    const c = result.data;
                    editId = id;
                    document.getElementById('inputID').value = c.cattle_code;
                    document.getElementById('inputName').value = c.name || '';
                    document.getElementById('inputBreed').value = c.breed || 'บราห์มัน';

                    // คำนวณอายุ
                    if (c.birth_date) {
                        const birth = new Date(c.birth_date);
                        const today = new Date();
                        document.getElementById('inputAgeYear').value = today.getFullYear() - birth.getFullYear();
                        document.getElementById('inputAgeMonth').value = today.getMonth() - birth.getMonth();
                    }

                    document.getElementById('inputGender').value = c.gender === 'male' ? 'ตัวผู้' : 'ตัวเมีย';
                    document.getElementById('inputStatus').value = c.status || 'พ่อพันธุ์ / แม่พันธุ์';
                    document.getElementById('inputPen').value = c.source || '';
                    document.getElementById('inputDate').value = c.entry_date ? c.entry_date.split('T')[0] : '';

                    if (c.image_url) {
                        base64Image = c.image_url;
                        document.getElementById('previewImage').src = c.image_url;
                        document.getElementById('previewImage').classList.remove('hidden');
                        document.getElementById('placeholderText').classList.add('hidden');
                    }

                    toggleModal();
                }
            } catch (error) {
                console.error('Error editing:', error);
            }
        }

                        loadCattleFromAPI();
                    } else {
                        alert(result.message || 'เกิดข้อผิดพลาด');
                    }
                } catch (error) {
                    console.error('Error deleting:', error);
                    alert('เกิดข้อผิดพลาดในการลบ');
                }
            }
        }

        function clearForm() {
            document.querySelectorAll('#cattleModal input, #cattleModal select').forEach(i => i.value = '');
            document.getElementById('previewImage').classList.add('hidden');
            document.getElementById('placeholderText').classList.remove('hidden');
            base64Image = "";
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('breedFilter').addEventListener('change', filterData);

        // Sidebar Toggle Functions
        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        window.addEventListener('resize', function () {
            if (window.innerWidth > 768) {
                document.body.classList.remove('sidebar-open');
            }
        });

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function () {
                if (window.innerWidth <= 768) {
                    document.body.classList.remove('sidebar-open');
                }
            });
        });
    </script>
</body>

</html>

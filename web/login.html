<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="login.css">
</head>

<body class="bg-login">

  <div class="container">
    <div class="left">
      <div class="login-box">
        <h1 class="texth1">Sign In</h1>
        <form id="loginForm" onsubmit="return handleLogin(event)">
          <label>Username</label>
          <input type="text" id="username" placeholder="Enter your username (e.g. somchai@doctor)" required />
          <label>Password</label>
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="submit" class="login-btn">Log In</button>
        </form>
        <div class="options">
          <p>Don't have an account ? <a href="register.html" class="SignUp-line" id="SignUp">Sign Up</a></p>
        </div>
      </div>
      <script>
        function handleLogin(event) {
          event.preventDefault();
          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;

          if (!username || !password) {
            alert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
            return false;
          }

          // Get registered users from localStorage
          const users = JSON.parse(localStorage.getItem('registeredUsers')) || [];

          // Find user by username (with role suffix)
          const user = users.find(u => u.username === username && u.password === password);

          if (user) {
            // Save current user to sessionStorage
            const currentUser = {
              username: user.username,
              email: user.email,
              role: user.role,
              loginTime: new Date().toISOString()
            };
            sessionStorage.setItem('currentUser', JSON.stringify(currentUser));

            // Redirect to dashboard
            window.location.href = 'index.html';
          } else {
            alert('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
          }
          return false;
        }
      </script>
    </div>
    <div class="right"></div>
  </div>
  <script src="login.js"></script>
</body>

</html>

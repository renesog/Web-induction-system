<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account</title>
  <link rel="stylesheet" href="register.css">
</head>

<body class="bg-reg">
  <div class="container">
    <div class="left">
      <div class="login-box">
        <h1 class="texth1">Create an Account</h1>
        <form id="registerForm" onsubmit="return handleRegister(event)">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" required />
          <label>Password</label>
          <div><input type="password" id="password" placeholder="Enter your password" required /></div>
          <label>Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm password" required />
          <button type="submit" class="login-btn">Register</button>
        </form>
        <div class="options">
          <p>Already have an account ? <a href="login.html" class="SignIn-line" id="SignIn">Sign In</a></p>
        </div>
      </div>
      <script>
        function handleRegister(event) {
          event.preventDefault();
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          const confirmPassword = document.getElementById('confirmPassword').value;

          if (password !== confirmPassword) {
            alert('รหัสผ่านไม่ตรงกัน กรุณากรอกใหม่');
            return false;
          }

          if (email && password && confirmPassword) {
            window.location.href = 'login.html';
          }
          return false;
        }
      </script>
    </div>
    <div class="right"></div>
  </div>
  <script src="register.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข้อมูลการเจริญเติบโต - Induction System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style5.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex bg-[#f9fbf9]">

    <aside class="sidebar">
        <div class="flex flex-col items-center mb-10">
            <img src="image/cow 1.png" class="w-16 mb-4 opacity-90" alt="Logo">
            <h2 class="text-white font-bold text-xl tracking-wide">Induction System</h2>
        </div>
        
        <nav class="space-y-2 px-2">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house w-6 text-center mr-2"></i> หน้าหลัก</a>
            <a href="cattle_info.html" class="nav-link"><i class="fa-solid fa-cow w-6 text-center mr-2"></i> บันทึกข้อมูลโค</a>
            <a href="feeding.html" class="nav-link"><i class="fa-solid fa-wheat-awn w-6 text-center mr-2"></i> ข้อมูลการให้อาหาร</a>
            <a href="growth.html" class="nav-link active"><i class="fa-solid fa-chart-line w-6 text-center mr-2"></i> ข้อมูลการเจริญเติบโต</a>
            <a href="health.html" class="nav-link"><i class="fa-solid fa-heart-pulse w-6 text-center mr-2"></i> ข้อมูลสุขภาพและการดูแล</a>
        </nav>
    </aside>

    <main class="main-content">
        
        <header class="header shadow-sm relative z-50">
            <div class="relative">
                <button id="profileBtn" class="user-icon shadow-md cursor-pointer hover:bg-gray-50 transition focus:outline-none">
                    <i class="fa-regular fa-user text-gray-600"></i>
                </button>

                <div id="profileDropdown" class="hidden absolute right-0 mt-3 w-48 bg-white rounded-xl shadow-xl py-2 border border-gray-100 transform origin-top-right transition-all">
                    <a href="profile.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-green-50 hover:text-green-700 transition">
                        <i class="fa-regular fa-circle-user mr-3 text-lg"></i> 
                        <span class="font-medium">โปรไฟล์</span>
                    </a>
                    <div class="border-t border-gray-100 my-1"></div>
                    <a href="login.html" class="flex items-center px-4 py-3 text-gray-700 hover:bg-red-50 hover:text-red-600 transition">
                        <i class="fa-solid fa-arrow-right-from-bracket mr-3 text-lg"></i> 
                        <span class="font-medium">ออกจากระบบ</span>
                    </a>
                </div>
            </div>
        </header>

        <div class="p-8">
            <div class="max-w-5xl mx-auto mb-8">
                <h1 class="text-3xl font-bold text-[#2D4A31] mb-6 border-l-8 border-[#85C38C] pl-4">
                    ข้อมูลการเจริญเติบโต
                </h1>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 mb-8">
                    <div class="relative mb-4">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <input type="text" id="searchInput" placeholder="ค้นหาด้วย ID หรือ ชื่อโค..." class="w-full p-2 border rounded-lg pl-10 shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none">
                    </div>
                    <div class="flex flex-wrap gap-4">
                        <select id="breedFilter" class="p-2 border rounded-lg bg-white min-w-[180px] shadow-sm focus:ring-2 focus:ring-green-400 cursor-pointer">
                            <option value="all">สายพันธุ์ (ทั้งหมด)</option>               
                            <option value="บราห์มัน">บราห์มัน</option>
                            <option value="แองกัส">แองกัส</option>
                            <option value="ชาร์โรเล่ส์">ชาร์โรเล่ส์</option>
                        </select>
                        <select id="recorderFilter" class="p-2 border rounded-lg bg-white min-w-[200px] shadow-sm focus:ring-2 focus:ring-green-400 cursor-pointer">
                            <option value="all">ผู้บันทึกข้อมูล (ทั้งหมด)</option>
                            <option value="นายสิทธิโชค จุ้ยขาว">นายสิทธิโชค จุ้ยขาว</option>
                            <option value="นายศุภกิตติ์ เสาร์แก้ว">นายศุภกิตติ์ เสาร์แก้ว</option>
                            <option value="นางสาวอภิธยา วิริยะ">นางสาวอภิธยา วิริยะ</option>
                            <option value="นายจิรพันฒ์ รัศสุวรรณ">นายจิรพันฒ์ รัศสุวรรณ</option>
                            <option value="ลุงสำราญ ปราณบุรี">ลุงสำราญ ปราณบุรี</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="growthGrid"></div>
            </div>
        </div>

        <button onclick="toggleModal()" class="fixed bottom-8 right-8 w-16 h-16 bg-[#4ade80] text-white text-4xl rounded-full shadow-lg hover:bg-[#22c55e] hover:scale-110 transition-all flex items-center justify-center z-40">
            <i class="fa-solid fa-plus"></i>
        </button>

    </main>

    <div id="growthModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-[200] p-4">
        <div class="bg-white rounded-[20px] w-full max-w-5xl p-8 relative shadow-2xl overflow-y-auto max-h-[95vh]">
            
            <h2 class="text-3xl font-bold mb-8 text-center text-[#1a4d2e]">บันทึกการเจริญเติบโต</h2>
            
            <div class="flex flex-col md:flex-row gap-8">
                
                <div class="w-full md:w-[35%] flex flex-col items-center">
                    <div class="w-full aspect-square bg-[#f5f5f5] rounded-3xl flex items-center justify-center border border-gray-200 overflow-hidden mb-3 shadow-inner">
                        <img id="growthPreview" src="https://cdn-icons-png.flaticon.com/512/1998/1998610.png" class="w-full h-full object-cover">
                    </div>
                    <p class="text-gray-400 text-xs italic">* รูปภาพดึงจากฐานข้อมูลหลัก</p>
                </div>

                <div class="flex-1 space-y-5">
                    
                    <div class="bg-[#eff6ff] p-5 rounded-xl border border-blue-100 shadow-sm">
                        <label class="block text-[#1e40af] font-bold mb-2 text-sm">ค้นหา ID โค :</label>
                        <div class="flex gap-3">
                            <input type="text" id="inputID" placeholder="กรอก ID ที่นี่..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-white text-sm">
                            <button onclick="pullData()" class="bg-[#2563eb] text-white px-5 py-2 rounded-lg font-bold hover:bg-blue-700 transition flex items-center gap-2 shadow-sm text-sm whitespace-nowrap">
                                <i class="fa-solid fa-download"></i> ดึงข้อมูล
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 font-bold mb-1 text-sm">ชื่อ/ฉายา :</label>
                            <input type="text" id="inputName" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 text-gray-500 cursor-not-allowed text-sm" readonly>
                        </div>
                        <div>
                            <label class="block text-gray-700 font-bold mb-1 text-sm">สายพันธุ์ :</label>
                            <input type="text" id="inputBreed" class="w-full bg-gray-100 border border-gray-200 rounded-lg px-3 py-2 text-gray-500 cursor-not-allowed text-sm" readonly>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 font-bold mb-1 text-sm">เพศ :</label>
                            <select id="inputGender" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 text-sm">
                                <option>เมีย</option><option>ผู้</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-gray-700 font-bold mb-1 text-sm">สถานะ :</label>
                            <input type="text" id="inputStatus" class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 text-sm">
                        </div>
                    </div>

                    <hr class="border-gray-200">

                    <div class="grid grid-cols-2 gap-4 bg-green-50 p-4 rounded-xl border border-green-100">
                        <div>
                            <label class="block text-green-800 font-bold mb-1 text-sm">น้ำหนักเริ่มต้น (กก.) :</label>
                            <input type="number" id="inputWeightStart" class="w-full border border-green-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-green-800 font-bold mb-1 text-sm">น้ำหนักล่าสุด (กก.) :</label>
                            <input type="number" id="inputWeightLatest" class="w-full border border-green-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 text-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-700 font-bold mb-1 text-sm">วันที่ชั่งน้ำหนัก :</label>
                            <input type="date" id="inputDate" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 cursor-pointer text-sm">
                        </div>
                        <div>
                            <label class="block text-gray-700 font-bold mb-1 text-sm">ผู้บันทึก :</label>
                            <input type="text" id="inputRecorder" class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-green-500 text-sm">
                        </div>
                    </div>

                </div>
            </div>

            <div class="mt-10 flex justify-center gap-4">
                <button onclick="toggleModal()" class="bg-[#9ca3af] hover:bg-gray-500 text-white px-8 py-2 rounded-full font-bold transition">ยกเลิก</button>
                <button onclick="saveGrowthData()" class="bg-[#1a4d2e] hover:bg-[#143d24] text-white px-10 py-2 rounded-full font-bold shadow-lg transition transform hover:scale-105">บันทึกน้ำหนัก</button>
            </div>

        </div>
    </div>

    <script>
        // --- 1. Dropdown Logic ---
        const profileBtn = document.getElementById('profileBtn');
        const profileDropdown = document.getElementById('profileDropdown');
        if(profileBtn && profileDropdown) {
            profileBtn.addEventListener('click', (e) => { e.stopPropagation(); profileDropdown.classList.toggle('hidden'); });
            document.addEventListener('click', (e) => { if (!profileBtn.contains(e.target) && !profileDropdown.contains(e.target)) { profileDropdown.classList.add('hidden'); } });
        }

        // --- 2. Growth Logic ---
        let editId = null;
        let currentCowImage = "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";

        window.onload = () => filterGrowthData();

        function pullData() {
            const tid = document.getElementById('inputID').value;
            const mainData = JSON.parse(localStorage.getItem('cattleMainData')) || [];
            const cow = mainData.find(c => c.id === tid);
            if(cow) {
                document.getElementById('inputName').value = cow.name;
                document.getElementById('inputBreed').value = cow.breed;
                currentCowImage = cow.image || "https://cdn-icons-png.flaticon.com/512/1998/1998610.png"; 
                document.getElementById('growthPreview').src = currentCowImage;
            } else { 
                alert("ไม่พบ ID: " + tid + " ในฐานข้อมูลหลัก");
                document.getElementById('inputName').value = "";
                document.getElementById('inputBreed').value = "";
                document.getElementById('growthPreview').src = "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
            }
        }

        function toggleModal() {
            document.getElementById('growthModal').classList.toggle('hidden');
            if(document.getElementById('growthModal').classList.contains('hidden')) { editId = null; clearForm(); }
        }

        function saveGrowthData() {
            const start = parseFloat(document.getElementById('inputWeightStart').value || 0);
            const latest = parseFloat(document.getElementById('inputWeightLatest').value || 0);
            const cow = {
                id: document.getElementById('inputID').value, name: document.getElementById('inputName').value,
                breed: document.getElementById('inputBreed').value, weightStart: start, weightLatest: latest,
                date: document.getElementById('inputDate').value, status: document.getElementById('inputStatus').value,
                gender: document.getElementById('inputGender').value, recorder: document.getElementById('inputRecorder').value,
                image: currentCowImage, adg: ((latest - start) / 30).toFixed(2)
            };
            if(!cow.id || !cow.name) return alert("กรุณาระบุ ID และกดปุ่มดึงข้อมูล");
            let list = JSON.parse(localStorage.getItem('cattleGrowthData')) || [];
            if(editId) { const idx = list.findIndex(c => c.id === editId); list[idx] = cow; }
            else { list.push(cow); }
            localStorage.setItem('cattleGrowthData', JSON.stringify(list));
            filterGrowthData(); toggleModal();
        }

        function renderCard(cow) {
            // คำนวณสีของ ADG (ถ้าโตดีเป็นสีเขียว ถ้าติดลบเป็นสีแดง)
            let adgColor = parseFloat(cow.adg) >= 0 ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';

            const html = `
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-200 shadow-sm hover:shadow-md transition-all flex flex-col group">
                    <div class="h-44 overflow-hidden bg-gray-100 relative">
                        <img src="${cow.image}" class="w-full h-full object-cover transform transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1998/1998610.png'">
                        <div class="absolute top-2 right-2 px-3 py-1 rounded-full text-xs font-bold ${adgColor} shadow-sm backdrop-blur-sm">
                            ADG: ${cow.adg}
                        </div>
                    </div>
                    <div class="p-4 flex-1 text-sm space-y-2">
                        <div class="flex justify-between items-center pb-2 border-b border-gray-100">
                            <span class="font-bold text-lg text-gray-800">${cow.name}</span>
                            <span class="text-xs text-gray-500">ID: ${cow.id}</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2 my-2">
                            <div class="bg-gray-50 p-2 rounded-lg text-center border border-gray-100">
                                <p class="text-xs text-gray-400">เริ่มต้น</p>
                                <p class="font-bold text-gray-700">${cow.weightStart} กก.</p>
                            </div>
                            <div class="bg-green-50 p-2 rounded-lg text-center border border-green-100">
                                <p class="text-xs text-green-600">ล่าสุด</p>
                                <p class="font-bold text-green-800">${cow.weightLatest} กก.</p>
                            </div>
                        </div>

                        <p class="text-gray-600 text-xs"><i class="fa-regular fa-calendar mr-1 text-green-500"></i> ชั่งเมื่อ: ${cow.date || '-'}</p>
                        <p class="text-gray-600 text-xs"><i class="fa-solid fa-user-pen mr-1 text-green-500"></i> ผู้บันทึก: ${cow.recorder}</p>
                        
                        <div class="flex justify-end gap-2 mt-3 pt-3 border-t border-gray-100">
                            <button onclick="editCard('${cow.id}')" class="w-8 h-8 bg-white border border-gray-300 rounded-full text-gray-500 hover:text-blue-600 hover:border-blue-300 transition"><i class="fa-solid fa-pen text-xs"></i></button>
                            <button onclick="deleteCard('${cow.id}')" class="w-8 h-8 bg-white border border-gray-300 rounded-full text-gray-500 hover:text-red-600 hover:border-red-300 transition"><i class="fa-solid fa-trash text-xs"></i></button>
                        </div>
                    </div>
                </div>`;
            document.getElementById('growthGrid').insertAdjacentHTML('afterbegin', html);
        }

        function filterGrowthData() {
            const s = document.getElementById('searchInput').value.toLowerCase();
            const b = document.getElementById('breedFilter').value;
            const r = document.getElementById('recorderFilter').value;
            let list = JSON.parse(localStorage.getItem('cattleGrowthData')) || [];
            document.getElementById('growthGrid').innerHTML = '';
            
            const filtered = list.filter(c => (c.id.toLowerCase().includes(s) || (c.name && c.name.toLowerCase().includes(s))) && 
                        (b === 'all' || c.breed === b) && 
                        (r === 'all' || c.recorder === r));

            if (filtered.length === 0) {
                document.getElementById('growthGrid').innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
                        <div class="bg-gray-100 p-6 rounded-full mb-4"><i class="fa-solid fa-magnifying-glass text-4xl text-gray-300"></i></div>
                        <p class="text-xl font-medium">ไม่พบข้อมูลที่ค้นหา</p>
                    </div>`;
            } else {
                filtered.forEach(c => renderCard(c));
            }
        }

        function editCard(id) {
            const list = JSON.parse(localStorage.getItem('cattleGrowthData')) || [];
            const cow = list.find(c => c.id === id);
            if(cow) {
                editId = id; document.getElementById('inputID').value = cow.id; document.getElementById('inputName').value = cow.name;
                document.getElementById('inputWeightStart').value = cow.weightStart; document.getElementById('inputWeightLatest').value = cow.weightLatest;
                document.getElementById('inputBreed').value = cow.breed; document.getElementById('inputDate').value = cow.date;
                document.getElementById('inputStatus').value = cow.status; document.getElementById('inputGender').value = cow.gender;
                document.getElementById('inputRecorder').value = cow.recorder; currentCowImage = cow.image;
                document.getElementById('growthPreview').src = cow.image || "https://cdn-icons-png.flaticon.com/512/1998/1998610.png"; toggleModal();
            }
        }

        function deleteCard(id) { if(confirm("ต้องการลบข้อมูลการเจริญเติบโตนี้หรือไม่?")) {
            let list = JSON.parse(localStorage.getItem('cattleGrowthData')) || [];
            list = list.filter(c => c.id !== id); localStorage.setItem('cattleGrowthData', JSON.stringify(list)); filterGrowthData();
        } }

        function clearForm() { 
            document.querySelectorAll('#growthModal input, #growthModal select').forEach(i => i.value = ''); 
            document.getElementById('growthPreview').src = "https://cdn-icons-png.flaticon.com/512/1998/1998610.png";
        }
        document.getElementById('searchInput').addEventListener('input', filterGrowthData);
        document.getElementById('breedFilter').addEventListener('change', filterGrowthData);
        document.getElementById('recorderFilter').addEventListener('change', filterGrowthData);
    </script>
</body>
</html>
